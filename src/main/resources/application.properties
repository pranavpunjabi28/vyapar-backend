spring.application.name=vyapar-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vyapar}
spring.datasource.username=${DATABASE_USERNAME:pranavpunjabi}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
    spring.flyway.enabled=true
# Tell Flyway to initialize the history table if it doesn't exist
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.web.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.refresh-cookie-name=${REFRESH_COOKIE_NAME:vyapar_refresh}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.invitation.hours=${INVITATION_HOURS:72}
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:${app.storage.endpoint}}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage.bucket=${STORAGE_BUCKET:vyapar-media}
app.storage.signed-url-ttl-seconds=${STORAGE_SIGNED_URL_TTL_SECONDS:900}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:5242880}
app.storage.max-product-images=${STORAGE_MAX_PRODUCT_IMAGES:6}
app.storage.enabled=${STORAGE_ENABLED:true}
app.reports.max-range-days=${REPORT_MAX_RANGE_DAYS:366}
app.reports.max-export-rows=${REPORT_MAX_EXPORT_ROWS:100000}
app.dashboard.worker.minimum-events=${DASHBOARD_WORKER_MINIMUM_EVENTS:100}
app.dashboard.worker.maximum-wait-ms=${DASHBOARD_WORKER_MAXIMUM_WAIT_MS:300000}
app.dashboard.worker.trigger-check-ms=${DASHBOARD_WORKER_TRIGGER_CHECK_MS:10000}
app.dashboard.worker.batch-size=${DASHBOARD_WORKER_BATCH_SIZE:100}
app.dashboard.worker.max-batches-per-run=${DASHBOARD_WORKER_MAX_BATCHES_PER_RUN:20}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
app.logging.http.include-bodies=${HTTP_LOG_INCLUDE_BODIES:true}
app.logging.http.max-body-bytes=${HTTP_LOG_MAX_BODY_BYTES:8192}
logging.level.root=INFO
logging.level.com.bbu.vyaparbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-} userId=%X{userId:-} merchantId=%X{merchantId:-} outletId=%X{outletId:-} logger=%logger{36} message=%msg%n
